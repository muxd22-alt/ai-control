<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Local AI</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --line: #242a33; --fg: #e8ecf1;
    --muted: #8b95a5; --accent: #5ac8fa; --me: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #666; }
  #dot.on { background: #22c55e; }
  #dot.busy { background: #f59e0b; }
  header b { font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
        border-bottom-left-radius: 4px; }
  .ai.stream { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
         background: var(--panel); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  textarea {
    flex: 1; resize: none; background: #0e1116; color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font: inherit; max-height: 140px;
  }
  button { background: var(--accent); color: #06263a; border: 0; border-radius: 12px;
           padding: 10px 18px; font: 600 15px inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <i id="dot"></i>
  <b>Local AI</b>
  <span id="where">connecting</span>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask the model on this phone" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const where = document.getElementById('where');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

// The engine lives on the phone. From the phone that is 127.0.0.1, from the
// laptop on the same wifi it is the phone's address - same page either way.
const host = location.hostname || '127.0.0.1';
const API = 'http://' + host + ':8765/v1';

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ping() {
  try {
    const r = await fetch(API + '/models');
    where.textContent = r.ok ? 'engine online' : 'engine offline';
    dot.className = r.ok ? 'on' : '';
  } catch (e) {
    where.textContent = 'engine offline';
    dot.className = '';
  }
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble('me', text);
  input.value = '';
  input.style.height = 'auto';
  const answer = bubble('ai stream', '');
  dot.className = 'busy';
  send.disabled = true;
  try {
    const res = await fetch(API + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'local',
        messages: [{ role: 'user', content: text }],
        stream: true
      })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const chunk = JSON.parse(payload);
          const piece = chunk.choices && chunk.choices[0] &&
                        chunk.choices[0].delta && chunk.choices[0].delta.content;
          if (piece) {
            answer.textContent += piece;
            log.scrollTop = log.scrollHeight;
          }
        } catch (e) { /* a partial line, the next chunk completes it */ }
      }
    }
  } catch (err) {
    answer.textContent = 'error: ' + err.message;
  }
  answer.className = 'msg ai';
  dot.className = 'on';
  send.disabled = false;
  input.focus();
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

ping();
setInterval(ping, 15000);
</script>
</body>
</html>
